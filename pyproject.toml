[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-monitor"
version = "1.0.0"
description = "只读读取本地 Codex 会话日志的 Windows 桌面监控面板"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
codex-monitor = "codex_monitor.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
